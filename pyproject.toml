[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subsync"
version = "0.17.0"
description = "Subtitle Speech Synchronizer with High-Precision VAD Alignment, Batch Processing, and Series Subtitle Retrieval"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [
    { name = "Michał Szymaniak", email = "sc0typl@gmail.com" },
]
dependencies = [
    "certifi",
    "PyYAML",
    "requests>=2.0",
]

[project.optional-dependencies]
GUI = ["wxPython>=4.0"]
test = ["pytest>=7.0"]

[project.scripts]
subsync = "subsync.__main__:subsync"
subsync-cmd = "subsync.__main__:subsync"

[tool.setuptools.packages.find]
include = ["subsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
